name: Build Windows Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compile check
        run: python -m compileall -q .

      # 回归测试：选品 / 购买流程 / 登录判定 / 界面 / 版本一致性
      - name: Regression tests
        run: |
          python scripts/test_product_matcher.py
          python scripts/test_purchase_flow.py
          python scripts/test_login_detect.py
          python scripts/test_gui.py
          python scripts/test_version.py

      # ---------- 产物一：文件夹版（含命令行，启动快） ----------
      - name: Build folder edition
        run: pyinstaller LighthouseKeeper.spec --noconfirm

      # ---------- 产物二：单文件 GUI 版 ----------
      - name: Build single-file GUI edition
        run: pyinstaller LighthouseKeeperGUI.spec --noconfirm --distpath dist-gui --workpath build-gui

      - name: Verify folder edition
        shell: pwsh
        run: |
          $exe = "dist/LighthouseKeeper/LighthouseKeeper.exe"
          if (-not (Test-Path $exe)) { throw "构建产物不存在: $exe" }
          Write-Host "文件夹版 exe: $([math]::Round((Get-Item $exe).Length/1MB,2)) MB"

          # --version 必须与 tag 一致
          $reported = (& $exe --version | Select-String 'LighthouseKeeper v').ToString().Trim()
          Write-Host "exe 版本: $reported"
          if (-not $reported) { throw "exe --version 没有输出可识别的版本行" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVer = $env:GITHUB_REF -replace '^refs/tags/v', ''
            if ($reported -notmatch [regex]::Escape($tagVer)) {
              throw "文件夹版版本($reported) 与 tag v$tagVer 不一致"
            }
            Write-Host "文件夹版版本与 tag 一致: v$tagVer"
          }

          # --version 会在 exe 旁边生成一个空日志，别让它混进发布包
          Remove-Item -Recurse -Force dist/LighthouseKeeper/logs -ErrorAction SilentlyContinue

      - name: Verify single-file GUI edition
        shell: pwsh
        run: |
          $exe = "dist-gui/LighthouseKeeper.exe"
          if (-not (Test-Path $exe)) { throw "构建产物不存在: $exe" }
          Write-Host "单文件体积: $([math]::Round((Get-Item $exe).Length/1MB,1)) MB"

          # 真·单文件：目录里只能有这一个 exe
          $others = Get-ChildItem dist-gui | Where-Object { $_.Name -ne "LighthouseKeeper.exe" }
          if ($others) { throw "dist-gui 里多了文件: $($others.Name -join ', ')" }

          # 打包自检：Playwright 驱动 + tkinter 都要能在单文件里跑起来
          & $exe --self-check | Out-Null
          $report = "dist-gui/self-check.log"
          if (-not (Test-Path $report)) { throw "自检没有产出 self-check.log" }
          Get-Content $report | Write-Host
          if (-not (Select-String -Path $report -Pattern "SELF-CHECK OK" -Quiet)) {
            throw "浏览器驱动自检失败，见上方输出"
          }
          if (-not (Select-String -Path $report -Pattern "GUI-CHECK OK" -Quiet)) {
            throw "tkinter 自检失败（tcl/tk 数据没打进去？），见上方输出"
          }

          # 文件属性里的版本必须与 config.VERSION 一致
          $ver = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "单文件版文件版本: $ver"
          $expected = (Select-String -Path config.py -Pattern '^VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          if ($ver -notlike "$expected*") { throw "单文件版版本 $ver 与 config.VERSION $expected 不一致" }

          Remove-Item $report -ErrorAction SilentlyContinue
          Get-ChildItem dist-gui | Select-Object Name, Length

      # 文件夹版的运行时完整性：版本可读 + 浏览器驱动可用 + tkinter 可用。
      # 用 --self-check 而不是直接启动（无参数=GUI 会挂住、--cli 会真跑流程）。
      - name: Smoke test
        run: python scripts/ci_smoke_test.py dist/LighthouseKeeper/LighthouseKeeper.exe

      - name: Copy release extras
        shell: pwsh
        run: |
          Copy-Item config.example.py dist/LighthouseKeeper/ -Force
          if (Test-Path README.md) { Copy-Item README.md dist/LighthouseKeeper/ -Force }

      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: LighthouseKeeper-windows
          path: dist/LighthouseKeeper
          retention-days: 14

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: LighthouseKeeper-GUI-single
          path: dist-gui/LighthouseKeeper.exe
          retention-days: 14

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LighthouseKeeper -DestinationPath LighthouseKeeper-windows.zip -Force
          Write-Host "zip 大小: $([math]::Round((Get-Item LighthouseKeeper-windows.zip).Length/1MB,2)) MB"

      # 推 tag（如 v1.1.0）时自动建 Release：单文件 exe + 文件夹版 zip 都附上
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-gui/LighthouseKeeper.exe
            LighthouseKeeper-windows.zip
          generate_release_notes: true
          body: |
            ## 下载哪个？

            | 文件 | 适合 | 说明 |
            | --- | --- | --- |
            | `LighthouseKeeper.exe` | 绝大多数人 | **单个文件**，双击开图形界面，无需解压 |
            | `LighthouseKeeper-windows.zip` | 想要更快启动 / 用命令行 | 解压后双击 exe，`--cli` 走纯命令行 |

            图形界面里可以改模式（测试 109 元 / 正式 38-39 元）、规格、价格、抢购时间、
            活动页地址；运行日志实时显示，点「停止」能立刻中断倒计时。

            命令行参数：`--cli`（无界面）、`--version`（版本）、`--self-check`（打包自检）。

            首次启动单文件版会慢几秒（需解压到临时目录），且请放在有写权限的目录
            （程序要在同目录写 `logs/`、`browser-data/`、`config.local.py`）。
